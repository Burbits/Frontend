<title>Burbit Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#FFFFFF; --s0:#F7F7F8; --s1:#FFFFFF; --s2:#F3F4F6; --line:#ECEDEF; --line2:#DFE1E5; --empty:#ECEDEF;
  --tx:#0E0F11; --tx2:#3C4049; --mut:#6B7079; --fnt:#7A7F88;
  --yes:#0B8F50; --no:#2563EB; --cur:#E60000; --curd:#F4B4B4; --info:#475569; --brand:#F70000;
  --yes-t:rgba(11,143,80,.10); --no-t:rgba(37,99,235,.10); --cur-t:rgba(230,0,0,.08); --info-t:rgba(71,85,105,.10); --mut-t:rgba(139,143,152,.12);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --px:'Silkscreen',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--tx);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.px{font-family:var(--px);font-weight:400;letter-spacing:.03em}
.mut{color:var(--mut)} .fnt{color:var(--fnt)} .c-yes{color:var(--yes)} .c-no{color:var(--no)} .c-cur{color:var(--cur)} .c-info{color:var(--info)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.app{display:flex;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;width:64px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0}
.rail .logo{width:36px;height:36px;margin-bottom:14px;display:block;border:0;background:none;padding:0}
.navb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:0;background:transparent;color:var(--mut)}
.navb:hover{color:var(--tx);background:var(--s1)}
.navb[aria-current="page"]{background:var(--s2);color:var(--tx)}
.navb .nl{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:56px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px}
.wordmark{font-family:var(--px);font-size:18px;letter-spacing:.05em}
.search{display:flex;align-items:center;gap:8px;width:340px;height:36px;padding:0 12px;background:var(--s1);border:1px solid var(--line2);border-radius:4px;color:var(--mut)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:13px}
.search input::placeholder{color:var(--fnt)}
.grow{flex:1}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.clock b{font:500 13px var(--mono)} .clock span{font-size:10px;color:var(--fnt)}
.xbtn{height:32px;padding:0 10px;border-radius:4px;border:1px solid rgba(230,0,0,.4);background:transparent;color:var(--cur);font-family:var(--px);font-size:11px;display:flex;align-items:center;gap:6px}
.xbtn[aria-pressed="true"]{background:var(--cur);color:#FFFFFF;border-color:var(--cur)}
.net{font-family:var(--px);font-size:11px;color:var(--info);border:1px solid rgba(71,85,105,.35);border-radius:4px;padding:4px 8px}
.wal{height:36px;padding:0 14px;background:var(--s2);border:1px solid var(--line2);border-radius:4px;font:500 13px var(--mono);display:flex;align-items:center;gap:8px}
.wal i{width:8px;height:8px;background:var(--yes)}
  .wal.off{background:var(--cur);color:#FFFFFF;border-color:var(--cur);font-family:var(--sans);font-weight:600}
.view{padding:24px 24px 120px;display:flex;flex-direction:column;gap:18px;min-width:0}

/* generic */
.panel{background:var(--s1);border:1px solid var(--line);border-radius:8px}
.btn{height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--line2);background:var(--s2);font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#C9CCD2}
.btn.solid-yes{background:var(--yes);border-color:var(--yes);color:#FFFFFF}
.btn.solid-no{background:var(--no);border-color:var(--no);color:#FFFFFF}
.btn.solid-cur{background:var(--cur);border-color:var(--cur);color:#FFFFFF}
.btn.solid-tx{background:var(--tx);border-color:var(--tx);color:#FFFFFF}
.btn.ghost{background:transparent}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:3px;font-family:var(--px);font-size:10px;white-space:nowrap}
.badge i{width:6px;height:6px;background:currentColor;flex-shrink:0}
.b-live{color:var(--yes);background:var(--yes-t)} .b-auc{color:var(--info);background:var(--info-t)} .b-cur{color:var(--cur);background:var(--cur-t)}
.b-mut{color:var(--mut);background:var(--mut-t)} .b-no{color:var(--no);background:var(--no-t)}
.tag{font-family:var(--px);font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.h2{font-family:var(--px);font-size:12px;font-weight:400;letter-spacing:.04em}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fnt)}
.ident{flex-shrink:0;background:#F3F4F6;border:1px solid var(--line2);display:grid;grid-template-columns:repeat(5,1fr)}
.ident span{aspect-ratio:1}
.blocks{display:grid;gap:2px}
.blocks span{display:block}
.empty{padding:32px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:8px}

/* feed */
.feed-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.feed-head h1{font-family:var(--px);font-weight:400;font-size:26px;line-height:30px;letter-spacing:.02em}
.feed-head p{color:var(--mut);font-size:13px;margin-top:6px;max-width:60ch}
.kpis{display:flex;gap:24px}
.kpis div{display:flex;flex-direction:column;align-items:flex-end}
.kpis b{font:500 18px var(--mono)} .kpis span{font-size:11px;color:var(--mut)}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:9999px;border:1px solid var(--line2);background:transparent;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.chip span{font:11px var(--mono);color:var(--mut)}
.chip[aria-pressed="true"]{background:var(--tx);border-color:var(--tx);color:#FFFFFF}
.chip[aria-pressed="true"] span{color:#B0B4BB}
.table{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--s0)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 190px 176px 128px 76px 124px;column-gap:16px;align-items:center;min-height:64px;padding:8px 16px;border-bottom:1px solid var(--s2)}
.frow:last-child{border-bottom:0}
.frow.hd{min-height:34px;padding:0 16px;border-bottom:1px solid var(--line);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--fnt)}
.frow.auc{background:rgba(71,85,105,.04)}
.frow.done{opacity:.72}
.mcell{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;text-align:left}
.mcell .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.mcell .tk{font:600 12px var(--mono);color:var(--tx)}
.mcell .q{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.mcell:hover .q{text-decoration:underline;text-underline-offset:3px}
.curvecell{display:flex;align-items:center;gap:10px}
.odds2{display:flex;gap:6px}
.ob{flex:1;height:32px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid}
.ob .mono{font-weight:500}
.ob.y{color:var(--yes);background:rgba(11,143,80,.10);border-color:rgba(11,143,80,.25)}
.ob.n{color:var(--no);background:rgba(37,99,235,.10);border-color:rgba(37,99,235,.25)}
.ob.y.ind{background:transparent;border-style:dashed;border-color:rgba(11,143,80,.45)}
.ob.n.ind{background:transparent;border-style:dashed;border-color:rgba(37,99,235,.45)}
.ob.win.y{background:var(--yes);color:#FFFFFF;border-color:var(--yes)}
.ob.win.n{background:var(--no);color:#FFFFFF;border-color:var(--no)}
.ob.lose{background:transparent;color:#A0A4AB;border-color:var(--line2)}
.ob.vd{background:transparent;color:var(--mut);border-color:var(--line2);border-style:dashed}
.oicell{display:flex;flex-direction:column;gap:5px;font-size:12px}
.bar3{height:3px;background:var(--empty)} .bar3 div{height:3px}
.right{text-align:right;display:flex;justify-content:flex-end}
.feed-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.side{display:flex;flex-direction:column;gap:24px;position:sticky;top:80px}
.pcard{display:flex;flex-direction:column;gap:6px;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:6px;text-align:left;width:100%}
.pcard:hover{border-color:var(--line2)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--s2);font-size:13px}
.srow:last-child{border-bottom:0}

/* home cards */
.homeintro p{color:var(--mut);font-size:13px}
.cats{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.cats button{height:42px;padding:0 12px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font-weight:600;white-space:nowrap}
.cats button:hover{color:var(--tx)}
.cats button[aria-pressed="true"]{color:var(--tx);border-bottom-color:var(--tx)}
.srcrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lpi{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font:600 8px var(--mono);font-style:normal;color:#FFFFFF}
.src{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);white-space:nowrap}
.src i{width:12px;height:12px;display:inline-flex;align-items:center;justify-content:center;font:600 7px var(--mono);font-style:normal;color:#FFFFFF}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card:hover{border-color:var(--line2)}
.card.auc{border-color:rgba(71,85,105,.35)}
.card.done{opacity:.75}
.ctop{display:flex;align-items:center;gap:10px}
.ctop .meta{display:flex;align-items:center;gap:6px;font-size:12px}
.ctop .tk{font:600 12px var(--mono)}
.ctop .src{align-self:flex-start}
.cq{font-size:16px;font-weight:600;line-height:22px;min-height:44px;background:none;border:0;padding:0;text-align:left;text-wrap:balance}
.cq:hover{text-decoration:underline;text-underline-offset:3px}
.chance{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.chance b{font:500 28px/32px var(--mono);font-variant-numeric:tabular-nums}
.chance span{font-size:12px;color:var(--mut)}
.ctx{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut)}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mut);padding-top:10px;border-top:1px solid var(--line)}

.venue{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;border-radius:3px;font-size:11px;font-weight:600;white-space:nowrap;align-self:flex-start;border:1px solid var(--line2);color:var(--tx2)}
.venue i{width:12px;height:12px;display:inline-flex;align-items:center;justify-content:center;font:600 6px var(--mono);font-style:normal;background:#3B5B9A;color:#fff}
.pmicon{width:32px;height:32px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#F3F4F6;border:1px solid var(--line2);font:600 11px var(--mono);color:var(--mut)}
.seg2{display:flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.seg2 button{height:32px;padding:0 12px;border:0;background:transparent;color:var(--mut);font-size:13px;font-weight:500;white-space:nowrap}
.seg2 button span{font:11px var(--mono);color:var(--fnt)}
.seg2 button[aria-pressed="true"]{background:var(--s2);color:var(--tx)}
.evq{font-size:16px;font-weight:600}
.evrows{display:flex;flex-direction:column}
.evrow{display:grid;grid-template-columns:minmax(0,1fr) 44px auto auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--s2)}
.evrow:last-child{border-bottom:0}
.evname{background:none;border:0;padding:0;text-align:left;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evname:hover{color:var(--tx);text-decoration:underline;text-underline-offset:3px}
.evpct{text-align:right;font-size:14px}
.mini{height:28px;padding:0 10px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid}
.mini.y{color:var(--yes);background:rgba(11,143,80,.10);border-color:rgba(11,143,80,.25)}
.mini.n{color:var(--no);background:rgba(37,99,235,.10);border-color:rgba(37,99,235,.25)}
.evlist{padding:6px 16px}
.evlist-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0}
.evline{display:grid;grid-template-columns:minmax(0,1fr) 64px auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.evline.on{box-shadow:inset 3px 0 0 var(--cur);padding-left:10px}
.evline .evname{display:flex;flex-direction:column;gap:2px;white-space:normal}
.evline .evname b{font-size:14px;color:var(--tx)}
.evline .evpct{font-size:18px}
.evline .mini{height:34px}
.mstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:14px 20px}
.mstats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.mstats b{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mstats span{font-size:11px;color:var(--mut)}
@media (max-width:700px){.mstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bkseg{display:flex;border:1px solid var(--line2);border-radius:4px;overflow:hidden}
.bkseg button{height:28px;padding:0 12px;border:0;background:transparent;font-size:12px;font-weight:600;color:var(--mut)}
.bkseg button[aria-pressed="true"].y{background:var(--yes);color:#fff}
.bkseg button[aria-pressed="true"].n{background:var(--no);color:#fff}
.tk-top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 0}
.tk-bs{display:flex;gap:16px}
.tk-bs button{background:none;border:0;padding:6px 0;font:600 13px var(--mono);letter-spacing:.06em;color:var(--mut);border-bottom:2px solid transparent}
.tk-bs button[aria-selected="true"]{color:var(--tx);border-bottom-color:var(--cur)}
.otype select,.kin select{background:transparent;border:0;font:600 13px var(--mono);letter-spacing:.04em;color:var(--tx);text-transform:uppercase;cursor:pointer}
.otype select{padding:6px 0}
.tk-q{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;line-height:20px}
.ynpill{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--s2);border-radius:9999px;padding:3px}
.yn{height:38px;border:0;border-radius:9999px;background:transparent;font:600 13px var(--mono);color:var(--mut)}
.yn.y[aria-pressed="true"]{background:var(--yes);color:#fff}
.yn.n[aria-pressed="true"]{background:var(--no);color:#fff}
.kfield{display:flex;align-items:center;justify-content:space-between;gap:12px;height:48px;padding:0 14px;border:1px solid var(--line2);border-radius:6px}
.kfield:focus-within{border-color:var(--tx)}
.kfield label{font-size:13px;font-weight:500;white-space:nowrap}
.kin{display:flex;align-items:center;gap:4px;min-width:0;flex:1;justify-content:flex-end}
.kin input{width:100%;min-width:0;border:0;outline:none;background:transparent;font:600 18px var(--mono);text-align:right}
.kin select{text-transform:none;font:500 14px var(--sans);text-align:right}
.kline{font-size:12px;color:var(--mut);margin-top:-6px}
.kcheck{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 14px;border:1px solid var(--line2);border-radius:6px;font-size:13px;cursor:pointer}
.kcheck input{width:18px;height:18px;margin:0;accent-color:var(--tx)}
.ksum dt{display:flex;flex-direction:column;color:var(--tx);font-weight:500}
.ksum dt small{font-size:11px;color:var(--mut);font-weight:400}
.ksum div.fee dt,.ksum div.fee dd{color:var(--mut);font-weight:400}
.ksum div.big{padding-top:8px;border-top:1px solid var(--line)}
.ksum div.big dt,.ksum div.big dd{font-weight:600;font-size:15px}
.ksum div.pay dd{font-size:22px;font-weight:600}
.ksum dd.pay{font-size:24px;font-weight:600}
.review{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.tk-act{display:flex;border-bottom:1px solid var(--line)}
.tk-act button{flex:1;height:46px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--mut);font-weight:600;font-size:15px}
.tk-act button[aria-selected="true"]{border-bottom-color:var(--cur);color:var(--tx)}
.hold{font-size:11px;color:var(--mut);text-align:center;margin-top:-6px}
.cats .lpi{margin-right:6px;vertical-align:-2px}
.crumbs button[data-act="cat"]{color:var(--mut)}

/* featured hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
.hcard{background:var(--s1);border:1px solid var(--line2);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.hcard .hq{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.01em;text-wrap:balance;background:none;border:0;padding:0;text-align:left}
.hcard .hq:hover{text-decoration:underline;text-underline-offset:4px}
.hmain{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:stretch}
.hodds{display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.hodds .big{font:500 48px/52px var(--mono);font-variant-numeric:tabular-nums}
.hstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.hstats div{display:flex;flex-direction:column;gap:2px}
.hstats b{font:500 13px var(--mono)} .hstats span{font-size:11px;color:var(--mut)}
.hnav{display:flex;align-items:center;gap:10px}
.hnav .arrow{width:32px;height:32px;border-radius:4px;border:1px solid var(--line2);background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx)}
.dots{display:flex;gap:4px}
.dots button{width:18px;height:6px;border:0;padding:0;background:var(--empty)}
.dots button[aria-current="true"]{background:var(--tx)}
.movers{background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--s2);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.mv:last-child{border-bottom:0}
.mv .t{font-size:13px;line-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .p{font:500 14px var(--mono);text-align:right}
.mv .s{font-size:11px;color:var(--mut);display:flex;gap:6px;align-items:center}
.mv .d{font:11px var(--mono);text-align:right}
@media (max-width:1180px){.hero{grid-template-columns:1fr}.movers{display:none}}
@media (max-width:700px){.hmain{grid-template-columns:1fr}.hstats{grid-template-columns:repeat(2,minmax(0,1fr))}.hcard .hq{font-size:20px;line-height:26px}.hodds .big{font-size:40px;line-height:44px}}

/* market */
.crumbs{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.crumbs button{background:none;border:0;padding:0;color:var(--mut)}
.crumbs button:hover{color:var(--tx)}
.mk{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}

<script>
(() => {
'use strict';
const U = 1; // one winning share pays $1 USDC
const SOLUSD = 150; // demo SOL price, to value the launchpad-side forcing cost in USDC
const BASE = 18 * 3600;
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r2 = (v) => Math.round(v * 100) / 100;
const mmss = (s) => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const clock = (s) => { s = Math.floor(s); return [Math.floor(s / 3600) % 24, Math.floor(s / 60) % 60, s % 60].map((v) => String(v).padStart(2, '0')).join(':'); };
const hm = (s) => clock(s).slice(0, 5);
const sol = (v, d = 3) => (Math.abs(v) < 0.0005 && d === 3 ? 0 : v).toFixed(d);
const usd = (v) => { const a = Math.abs(v); return (v < -0.004 ? '−' : '') + '$' + (a >= 1000 ? Math.round(a).toLocaleString('en-US') : a.toFixed(2)); };
const cents = (p) => Math.round(p * 100) + '¢';
const sgn = (v) => (v >= 0 ? '+' : '−') + '$' + Math.abs(v).toFixed(2);
const FORCE = [[0, 19.52], [30, 16.28], [50, 13.12], [70, 8.62], [80, 5.70], [90, 2.46], [95, 0.95], [100, 0]];
function forcing(p) { p = clamp(p, 0, 100); for (let i = 1; i < FORCE.length; i++) { const [a, x] = FORCE[i - 1], [b, y] = FORCE[i]; if (p <= b) return x + (y - x) * (p - a) / (b - a); } return 0; }
function raised(p) { const s = clamp(p, 0, 100) / 100 * 793.1; return 30 * s / (1073 - s); }
// Fees follow docs/09-FEES-AND-ECONOMICS.md. Everyone is tier 0 at launch.
const FEE = { taker: 0.02, maker: 0, makerSteady: 0.01, auction: 0.01, buffer: 0.02, tier: 0 };
const feeOf = (n, p) => n * p * U * FEE.taker;           // taker fee on your own fill value
const makerFeeOf = (n, p) => n * p * U * FEE.maker;      // waived at launch (normally 1%)
const auctionFeeOf = (n, p) => n * p * U * FEE.auction;  // half the taker rate, both sides
function hash(str) { let h = 7; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; }
const rnd = (a, b) => a + Math.random() * (b - a);

/* ---------- state ---------- */
const S = { t: 138, speed: 1, paused: false, view: 'feed', mid: null, filter: 'active', cat: 'all', q: '', explain: false, demo: false,
  wallet: null, bal: 5, markets: [], pos: {}, orders: [], oid: 1, spawnAt: 200, lastTicketKey: '', xTipShown: false };
const T = { act: 'buy', side: 'yes', tab: 'dollars', amount: '10', priceC: '28', shares: '100', exp: 'gtc', postOnly: false, review: false, guard: false, gmin: '75', gmax: '90', err: '' };

function M(o) {
  const m = Object.assign({ type: 'grad', win: 15, launchpad: 'pump.fun', volSol: 0, state: 'live', openPct: 70, mu: 0.03, vol: 0.3, oi: 0, trades: [], hist: [], outcome: null, capFix: null, halt: null, fairFix: 0.3, dev: '9fQ2…k1Lm' }, o);
  m.mint = (m.launchpad === 'Pons' ? '0x' + (hash(m.tick) % 65536).toString(16) : m.tick.slice(0, 4)) + '…' + (m.launchpad === 'pump.fun' ? 'pump' : m.launchpad === 'Pons' ? '7c1e' : 'rlab');
  if (!m.volSol) m.volSol = m.oi * 2.6 + rnd(45, 300);
  return m;
}
function cap(m) { return m.capFix != null ? m.capFix : 0.5 * forcing(m.pct) * SOLUSD; }
function capRoomPairs(m) { return Math.max(0, Math.floor((cap(m) - m.oi) / U + 1e-9)); }
function isOpen(m) { return m.state === 'live' || m.state === 'auction'; }
function mk(id) { return S.markets.find((m) => m.id === id); }

function fair(m) {
  if (m.type !== 'grad') return m.fairFix;
  const x = clamp((m.pct - 60) / 40, 0, 1);
  const tl = clamp((m.deadlineAt - S.t) / 600, 0.15, 1.6);
  return clamp(Math.pow(x, 2.2) * (0.55 + 0.45 * tl) * 1.2, 0.02, 0.97);

    S.bal -= cost + fee;
    const ps = P(m.id); if (side === 'yes') { ps.yes += q.n; ps.cy += cost + fee; } else { ps.no += q.n; ps.cn += cost + fee; }
    const mint = capRoomPairs(m) >= q.n;
    if (mint) m.oi += q.n * U;
    m.trades.unshift({ t: S.t, side: 'BUY ' + SIDE, p: q.p, n: q.n, kind: mint ? 'MINT' : 'TRANSFER', you: true });
    m.volSol += cost;
    m.mid = r2(clamp(m.mid + (side === 'yes' ? 0.01 : -0.01), 0.02, 0.98));
    toast('Bought <span class="mono">' + q.n.toLocaleString('en-US') + ' ' + SIDE + '</span> at ' + cents(q.p) + ': ' + usd(cost) + ' + ' + usd(fee) + ' fee = ' + usd(cost + fee) + '. If ' + SIDE + ' wins you get <span class="mono">' + usd(q.n * U) + '</span>.', side === 'yes' ? 'yes' : 'no');
  } else if (T.tab !== 'limit') {
    if (m.state !== 'live') return;
    sellShares(m, side, q.n);
  } else if (T.act === 'buy') {
    const yp = q.yesEq;
    if (m.state === 'live' && ((side === 'yes' && yp >= bestAsk(m)) || (side === 'no' && yp <= bestBid(m)))) {
      const px = priceFor(m, side), fee = feeOf(q.n, px), cost = q.n * px * U;
      S.bal -= cost + fee;
      const ps = P(m.id); if (side === 'yes') { ps.yes += q.n; ps.cy += cost + fee; } else { ps.no += q.n; ps.cn += cost + fee; }
      const o = addOrder({ mid: m.id, side, price: q.p, shares: q.n, guard: null, status: 'filled' }); o.filled = q.n; o.note = 'filled right away at ' + cents(px);
      m.trades.unshift({ t: S.t, side: 'BUY ' + SIDE, p: px, n: q.n, kind: capRoomPairs(m) >= q.n ? 'MINT' : 'TRANSFER', you: true });
      toast('Your limit crossed the book, so it filled right away at <span class="mono">' + cents(px) + '</span>, better than your ' + cents(q.p) + '.', 'info');
    } else {
      S.bal -= q.hold;
      const o = addOrder({ mid: m.id, side, price: q.p, shares: q.n, guard: null, status: m.state === 'auction' ? 'queued' : 'open' });
      o.expireAt = expireAt; o.note = EXP[T.exp].toLowerCase() + (T.postOnly ? ' · resting only' : '');
      toast((m.state === 'auction' ? 'Queued for the auction: ' : 'Buy order resting on the book: ') + '<span class="mono">' + q.n.toLocaleString('en-US') + ' ' + SIDE + ' at ' + cents(q.p) + '</span>. ' + usd(q.hold) + ' held until it fills (cost + 2% buffer).', 'info');
    }
  } else {
    if (q.p <= sellPx(m, side)) sellShares(m, side, q.n, 'Your price was at or below the best bid, so it sold right away at ' + cents(sellPx(m, side)) + '.');
    else {
      const ps = P(m.id), basis = side === 'yes' ? ps.cy / ps.yes : ps.cn / ps.no;
      if (side === 'yes') { ps.yes -= q.n; ps.cy -= basis * q.n; } else { ps.no -= q.n; ps.cn -= basis * q.n; }
      const o = addOrder({ mid: m.id, act: 'sell', side, price: q.p, shares: q.n, guard: null, status: 'open', basis });
      o.expireAt = expireAt; o.note = EXP[T.exp].toLowerCase() + (T.postOnly ? ' · resting only' : '');
      toast('Sell order resting on the book: <span class="mono">' + q.n + ' ' + SIDE + ' at ' + cents(q.p) + '</span>. Your shares are held until it fills.', 'info');
    }
  }
  refresh();
}

/* ---------- how it works ---------- */
function renderHow() {
  const capRows = [[0, 19.52], [50, 13.12], [70, 8.62], [80, 5.70], [90, 2.46], [95, 0.95]].map(([p, f]) => '<tr><td class="mono">' + p + '%</td><td class="mono">' + f.toFixed(2) + ' SOL</td><td class="mono">' + usd(f / 2 * SOLUSD) + '</td><td class="mono">' + Math.round(f / 2 * SOLUSD).toLocaleString('en-US') + '</td></tr>').join('');
  $('#view').innerHTML = '<div class="feed-head"><div><h1>HOW BURBIT WORKS</h1><p>Burbit is a prediction market where every event is captured from a bonding-curve launchpad: pump.fun, Raydium LaunchLab, Pons and more. It isn\'t a launchpad or a curve. It reads existing launchpads and runs short YES/NO markets on what their tokens do next.</p></div></div>' +
    '<div class="how">' +
    '<section class="panel"><h2 class="h2">1 · THE LIFE OF A MARKET</h2><div class="flow"><span class="badge b-mut"><i></i>NEAR GRADUATION</span><span class="arr">→</span><span class="badge b-auc"><i></i>AUCTION 60S</span><span class="arr">→</span><span class="badge b-live"><i></i>LIVE</span><span class="arr">→</span><span class="badge b-mut"><i></i>HALTED</span><span class="arr">→</span><span class="badge b-cur"><i></i>SETTLED</span></div><p>A token on a launchpad gets close to graduating. Burbit opens a market on it. For 60 seconds orders are collected, then everyone who crosses fills at one price. Trading runs until the token graduates (instant halt) or until 5 minutes before the deadline. Then anyone can call settle, and winners redeem.</p></section>' +
    '<section class="panel"><h2 class="h2">2 · SHARES AND PAIRS</h2><p>A winning share pays <span class="mono">$1</span>; a losing share pays nothing. One YES plus one NO always pays exactly $1, so shares only exist in pairs, each backed by $1 locked in the market\'s vault. A price is a probability: YES at <span class="mono">0.31</span> costs 31¢ and means a 31% chance.</p></section>' +
    '<section class="panel"><h2 class="h2">3 · FOUR WAYS A TRADE SETTLES</h2><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Buyer</th><th>Seller</th><th>What happens</th><th>Pairs</th></tr></thead><tbody><tr><td>Buy YES</td><td>Buy NO</td><td><span class="tag" style="color:var(--cur);border-color:rgba(230,0,0,.35)">MINT</span> both lock USDC, a new pair is created</td><td class="mono">+1</td></tr><tr><td>Buy YES</td><td>Sell YES</td><td><span class="tag">TRANSFER</span> YES changes hands</td><td class="mono">0</td></tr><tr><td>Sell NO</td><td>Sell YES</td><td><span class="tag">MERGE</span> pair burned, $1 split</td><td class="mono">−1</td></tr><tr><td>Buy NO</td><td>Sell NO</td><td><span class="tag">TRANSFER</span> NO changes hands</td><td class="mono">0</td></tr></tbody></table></div><p>Mint is why a market needs no market maker to start. Merge is why you can always cash out.</p></section>' +
    '<section class="panel"><h2 class="h2">4 · WHY IT CAN\'T BE PROFITABLY RIGGED</h2><p>Anyone could force a graduation YES by buying out the rest of the token\'s bonding curve on its launchpad. So each market\'s size is limited to half of that cost, which Burbit reads from the launchpad. The most an attacker can win is less than what forcing costs.</p><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Curve sold</th><th>Forcing cost (on the launchpad)</th><th>Max size (USDC)</th><th>Max (pairs)</th></tr></thead><tbody>' + capRows + '</tbody></table></div></section>' +
    '<section class="panel"><h2 class="h2">5 · LIMIT ORDERS</h2><p>"Set your odds" places a limit order: buy or sell YES or NO at a price you choose, or better. If nobody matches it right away it waits on the order book until someone takes it, you cancel it, or the market halts (then it\'s returned in full). "Quick bet" and "Sell now" take the best price already on the book instead. Burbit never trades against you; every trade is between two users.</p></section>' +
    '<section class="panel"><h2 class="h2">6 · WHAT BURBIT NEVER DOES</h2><p>It never creates, lists or trades tokens on a launchpad. It never takes a side or puts in its own capital; it earns trading fees: takers pay 2% of their fill value and makers 1% (waived at launch), falling with 30-day volume, and busy makers eventually earn part of the taker fee. It needs no permission from any launchpad: it reads public accounts. If an account can\'t be parsed, the market voids and everyone gets their collateral back.</p></section>' +
    '</div><p class="fnt" style="font-size:12px">This is a clickable prototype with simulated data. Token names, prices and wallets are made up. Numbers for caps and forcing cost follow the Burbit v3 spec.</p>';
}

function demoAction(v) {
  let m = mk(S.mid); if (!m) return;
  if (m.follow && (v === 'pump' || v === 'dump' || v === 'grad')) m = mk(m.follow);
  if (v === 'uncross' && m.state === 'auction') { m.auctionEnd = S.t; uncross(m); }
  if (v === 'pump') { m.pct = clamp(m.pct + 8, 0, m.type === 'grad' ? 99.6 : 99.5); m.mid = r2(clamp(fair(m), 0.02, 0.98)); toast('$' + m.tick + ' surged on ' + m.launchpad + ': buyers poured in.', 'cur'); }
  if (v === 'dump') { m.pct = clamp(m.pct - 10, 40, 100); m.mid = r2(clamp(fair(m), 0.02, 0.98)); toast('Insiders sold: $' + m.tick + ' dropped on ' + m.launchpad + '.', 'no'); }
  if (v === 'grad') { if (m.state === 'auction') m.state = 'live'; graduate(m); }
  if (v === 'fill') { m.oi = cap(m); m.trades.unshift({ t: S.t, side: 'BUY YES', p: bestAsk(m), n: 200, kind: 'MINT' }); toast('$' + m.tick + ' reached its maximum market size of <span class="mono">' + usd(cap(m)) + '</span>. No new pairs can be created.', 'cur'); }
  if (v === 'close') { m.closeAt = S.t; halt(m, 'close'); toast('Trading closed on $' + m.tick + '. It still settles YES if the token graduates before the deadline.', 'mut'); }
  if (v === 'deadline') { if (m.state === 'live') halt(m, 'close'); m.deadlineAt = S.t; resolve(m, m.type === 'grad' ? 'no' : 'no'); }
  if (v === 'void') voidM(m);
  if (v === 'rug') { if (m.state === 'live' || m.state === 'auction') halt(m, 'rug'); resolve(m, 'yes'); toast(m.type === 'bonded' ? 'The dev withdrew their bag from escrow. That is the rug: YES holders are paid from the ' + usd(m.bond) + ' bond.' : 'The dev wallet sold over half its bag. Settled YES from its token balance.', 'no'); }
  refresh(); renderDemo();
}

function go(view, id, side) {
  S.view = view; S.mid = id || null; T.err = '';
  if (side) { T.side = side; T.tab = 'quick'; }
  ['feed', 'port', 'how'].forEach((v) => { const b = $('#nav-' + v); if (b) b.setAttribute('aria-current', (view === v || (view === 'market' && v === 'feed')) ? 'page' : 'false'); });
  if (view !== 'market') { $('#mobbar').hidden = true; document.body.classList.remove('has-mobbar'); }
  if (view === 'feed') renderFeed();
  else if (view === 'market') buildMarket();
  else if (view === 'port') renderPort();
  else if (view === 'how') renderHow();
  if (S.demo) renderDemo();
  window.scrollTo(0, 0);
}
function refresh() {
  updateTopDynamic();
  if (S.view === 'feed') { const y = window.scrollY; renderFeed(); window.scrollTo(0, y); }
  else if (S.view === 'market') updateMarket(false);
  else if (S.view === 'port') renderPort();
}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  if (S.explain) {
    const x = e.target.closest('[data-x]');
    const safe = e.target.closest('#top .xbtn, #xd, #demo, #demoBtn');
    if (x && !safe) { e.preventDefault(); e.stopPropagation(); showX(x.dataset.x); return; }
  }
}, true);
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  const act = a.dataset.act, v = a.dataset.v, id = a.dataset.id;
  switch (act) {
    case 'nav': go(v); break;
    case 'open': go('market', id, v === 'yes' || v === 'no' ? v : null); break;
    case 'filter': S.filter = v; renderFeed(); break;
    case 'cat': S.cat = v; S.heroIdx = 0; go('feed'); break;
    case 'hero': S.heroIdx = (S.heroIdx || 0) + Number(v) + 5; S.heroIdx %= Math.max(1, document.querySelectorAll('.dots button').length || 5); S.heroHold = S.t + 20; renderFeed(); break;
    case 'herogo': S.heroIdx = Number(v); S.heroHold = S.t + 20; renderFeed(); break;
    case 'tact': { const m0 = mk(S.mid); T.act = v; T.err = ''; T.review = false; if (v === 'sell' && m0 && !held(m0, T.side) && held(m0, T.side === 'yes' ? 'no' : 'yes')) T.side = T.side === 'yes' ? 'no' : 'yes'; if (v === 'sell' && T.tab === 'dollars') T.tab = 'shares'; T.priceC = defaultPriceC(m0, T.act, T.side); T.shares = v === 'sell' && m0 ? String(held(m0, T.side) || '') : '100'; updateMarket(true); break; }
    case 'bookside': S.bookSide = v; updateMarket(false); break;
    case 'spreset': T.shares = v; updateMarket(true); break;
    case 'side': T.side = v; T.err = ''; T.review = false; T.priceC = defaultPriceC(mk(S.mid), T.act, v); if (T.act === 'sell' && mk(S.mid)) T.shares = String(held(mk(S.mid), v) || ''); updateMarket(true); break;
    case 'mside': T.side = v; T.act = 'buy'; T.tab = 'dollars'; T.review = false; updateMarket(true); $('#r-ticket').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'review': { const m0 = mk(S.mid); const err = m0 ? validate(m0) : ''; T.err = err; T.review = !err; updateMarket(false); break; }
    case 'editorder': T.review = false; updateMarket(false); break;
    case 'preset': T.amount = v; const ai = $('#amt'); if (ai) ai.value = v; updateMarket(false); break;
    case 'submit': submit(); break;
    case 'sell': sell(v); break;
    case 'merge': merge(); break;
    case 'cancel': cancel(Number(id)); break;
    case 'claim': claim(id); break;
    case 'claimall': for (const k in S.pos) { const m = mk(k); if (m && (m.state === 'resolved' || m.state === 'void') && payout(m, S.pos[k]) > 0) claim(k, true); } refresh(); break;
    case 'wallet': walletModal(); break;
    case 'explain': S.explain = !S.explain; document.body.classList.toggle('explain', S.explain); renderTop(); if (!S.explain) $('#xd').hidden = true; else showX('feed'); break;
    case 'xclose': $('#xd').hidden = true; break;
    case 'demo': S.demo = !S.demo; $('#demo').hidden = !S.demo; a.setAttribute('aria-expanded', S.demo); if (S.demo) renderDemo(); break;
    case 'speed': setSpeed(Number(v)); renderDemo(); renderTop(); break;
    case 'dx': demoAction(v); break;
    case 'spawn': spawn(); refresh(); break;
    case 'reset': init(); go('feed'); toast('Demo reset.', 'mut'); break;
    case 'pickwallet': S.wallet = v; $('#modal').hidden = true; renderTop(); go(S.view, S.mid); toast('Connected ' + v + '. Demo wallet with $500 USDC on devnet; nothing real is touched.', 'yes'); break;
    case 'disconnect': S.wallet = null; $('#modal').hidden = true; renderTop(); go(S.view, S.mid); break;
    case 'mclose': $('#modal').hidden = true; break;
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') { S.q = t.value; if (S.view !== 'feed') go('feed'); else renderFeed(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); return; }
  if (t.id === 'amt') T.amount = t.value;
  else if (t.id === 'lpc') T.priceC = t.value.replace(/[^0-9.]/g, '');
  else if (t.id === 'ls') T.shares = t.value;
  else if (t.id === 'gmin') T.gmin = t.value;
  else if (t.id === 'gmax') T.gmax = t.value;
  else return;
  T.err = ''; T.review = false;
  const m = mk(S.mid); if (m) renderTicketSum(m);
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'otype') { T.tab = e.target.value; T.err = ''; T.review = false; T.priceC = defaultPriceC(mk(S.mid), T.act, T.side); updateMarket(true); }
  if (e.target.id === 'exp') { T.exp = e.target.value; renderTicketSum(mk(S.mid)); }
  if (e.target.id === 'po') { T.postOnly = e.target.checked; T.err = ''; renderTicketSum(mk(S.mid)); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { $('#xd').hidden = true; $('#modal').hidden = true; if (S.demo) { S.demo = false; $('#demo').hidden = true; $('#demoBtn').setAttribute('aria-expanded', 'false'); } }
  if (e.key === 'Enter' && e.target.closest && e.target.closest('#r-tform') && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') submit();
});

function sellShares(m, side, n, lead) {
  const p = S.pos[m.id]; if (!p || m.state !== 'live') return;
  n = Math.min(n, side === 'yes' ? p.yes : p.no); if (!n) return;
  const px = sellPx(m, side), fee = feeOf(n, px), got = n * px * U - fee;
  S.bal += got;
  const merge = Math.random() < 0.5 && m.oi >= n * U;
  if (merge) m.oi -= n * U;
  if (side === 'yes') { p.cy -= p.cy / p.yes * n; p.yes -= n; } else { p.cn -= p.cn / p.no * n; p.no -= n; }
  m.volSol += n * px * U;
  m.trades.unshift({ t: S.t, side: 'SELL ' + side.toUpperCase(), p: px, n, kind: merge ? 'MERGE' : 'TRANSFER', you: true });
  toast((lead ? lead + ' ' : '') + 'Sold <span class="mono">' + n + ' ' + side.toUpperCase() + '</span> at ' + px.toFixed(2) + ' for <span class="mono">' + usd(got) + '</span> (' + (merge ? 'merged with a ' + (side === 'yes' ? 'NO' : 'YES') + ' seller: the pair was burned' : 'another trader bought them') + ').', 'info');
}
function sell(side) { const m = mk(S.mid); if (!m) return; sellShares(m, side, Infinity); refresh(); }
function merge() {
  const m = mk(S.mid), p = S.pos[m.id]; if (!m || !p) return;
  const n = Math.min(p.yes, p.no); if (!n) return;
  const fy = p.cy / p.yes, fn = p.cn / p.no;
  p.yes -= n; p.no -= n; p.cy -= fy * n; p.cn -= fn * n;
  S.bal += n * U; m.oi = Math.max(0, m.oi - n * U);
  m.trades.unshift({ t: S.t, side: 'MERGE', p: 1, n, kind: 'MERGE', you: true });
  toast('Merged <span class="mono">' + n + '</span> YES+NO pairs back into <span class="mono">' + usd((n * U)) + '</span>. Free, no fee.', 'info');
  refresh();
}
function cancel(id) {
  const o = S.orders.find((x) => x.id === id); if (!o) return;
  const back = release(o); o.status = 'cancelled';
  toast('Order cancelled: <span class="mono">' + back + '</span>.', 'mut');
  refresh();
}
function claim(id, quiet) {
  const m = mk(id), p = S.pos[id]; if (!m || !p) return;
  const pay = payout(m, p); if (pay <= 0) return;
  S.bal += pay; p.claimed = true; p.claimedAmt = pay;
  if (!quiet) toast('Claimed <span class="mono">' + usd(pay) + '</span> from $' + m.tick + '.', 'yes');
  if (!quiet) refresh();
}
function walletModal() {
  const md = $('#modal');
  const w = (name, c1, c2) => '<button class="wopt" data-act="pickwallet" data-v="' + name + '"><i style="background:linear-gradient(135deg,' + c1 + ' 50%,' + c2 + ' 50%)"></i>' + name + '<span class="fnt" style="margin-left:auto;font-weight:400;font-size:12px">demo</span></button>';
  md.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-label="Connect a wallet">' + (S.wallet
    ? '<h2 class="h2">WALLET</h2><p class="mono">' + S.wallet + '</p><p class="mut" style="font-size:13px">' + usd(S.bal) + ' free</p><button class="btn" data-act="disconnect">Disconnect</button><button class="btn ghost" data-act="mclose">Close</button>'
    : '<h2 class="h2">CONNECT A WALLET</h2><p class="mut" style="font-size:13px">Prototype only: pick one to get a demo wallet with $500 USDC. No real wallet is opened.</p>' + w('Phantom', '#AB9FF2', '#8A7BE0') + w('Solflare', '#FFC857', '#F28B30') + w('Backpack', '#E33E3F', '#B52A2B') + '<button class="btn ghost" data-act="mclose">Cancel</button>') + '</div>';
  md.hidden = false;
  md.onclick = (e) => { if (e.target === md) md.hidden = true; };
}
// wallet names get a short address when connected
const _pick = walletModal;

init();
renderTop();
go('feed');
setSpeed(1);
})();
</script>
